
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="gallery-section">
        <h1>My Image Gallery</h1>
        <p class="subtitle">Explore the beauty of nature, animals and cities.</p>

        <div class="filter-buttons">
            <button class="active" data-filter="all">All</button>
            <button data-filter="nature">Nature</button>
            <button data-filter="animals">Animals</button>
            <button data-filter="cities">Cities</button>
        </div>

        <div class="gallery">

            <!-- Nature: 4 images -->
            <div class="gallery-item" data-category="nature">
                <img src="images/nature.1.jpg" alt="Nature 1">
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="images/nature 2.jpg" alt="Nature 2">
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="images/nature.3.jpg" alt="Nature 3">
            </div>
            <div class="gallery-item" data-category="nature">
                <img src="images/nature.4.jpg" alt="Nature 4">
            </div>

            <!-- Animals: 4 images -->
            <div class="gallery-item" data-category="animals">
                <img src="images/animal 6.jpg" alt="Animal 1">
            </div>
            <div class="gallery-item" data-category="animals">
                <img src="animal.2.jpg" alt="Animal 2">
            </div>
            <div class="gallery-item" data-category="animals">
                <img src="images/animal 5.jpg" alt="Animal 3">
            </div>
            <div class="gallery-item" data-category="animals">
                <img src="animal.4.webp" alt="Animal 4">
            </div>

            <!-- Cities: 4 images -->
            <div class="gallery-item" data-category="cities">
                <img src="images/city 5.jpg" alt="City 1">
            </div>
            <div class="gallery-item" data-category="cities">
                <img src="city 2.jpg" alt="City 2">
            </div>
            <div class="gallery-item" data-category="cities">
                <img src="images/city 6.jpg" alt="City 3">
            </div>
            <div class="gallery-item" data-category="cities">
                <img src="images/city 7.jpg" alt="City 4">
            </div>

        </div>
        
<div class="pagination">
    <button id="prevBtn">Previous</button>
    <span id="pageInfo">1 / 4</span>
    <button id="nextBtn">Next</button>
</div>

    </section>
     <script src="script.js"></script>
</body>
</html>
